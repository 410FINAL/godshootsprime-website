<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&display=swap">
<style>
/* Admin portal: the photographer's back room. Folder list, then one folder per client with details, limits, sharing, photos and wording. */
:root {
  --black: #000000;
  --ink: #f4f4f4;
  --grey: #8e8e8e;
  --dim: #5c5c5c;
  --line: #222222;
  --lift: #0d0d0d;
  --raise: #141414;
  --white: #ffffff;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --gutter: clamp(16px, 5vw, 72px);
  --ease: cubic-bezier(.22, .61, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; -webkit-tap-highlight-color: transparent;
  background: var(--black); color: var(--ink);
  font: 300 16px/1.65 var(--sans); -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 1px solid var(--white); outline-offset: 4px; }
::selection { background: var(--white); color: var(--black); }

.label { font: 500 11px/1.2 var(--sans); font-stretch: 115%; letter-spacing: .24em; text-transform: uppercase; }
.muted { color: var(--grey); }
.wrap { padding-inline: var(--gutter); max-width: 1200px; margin-inline: auto; }
h1, h2 { font-weight: 400; font-family: var(--display); letter-spacing: -.015em; margin: 0; }
h1 em, h2 em { font-style: italic; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 0 24px; border: 1px solid var(--ink);
  font: 500 11px/1 var(--sans); font-stretch: 115%; letter-spacing: .24em; text-transform: uppercase;
  transition: background .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease), transform .2s;
  white-space: nowrap;
}
.btn.solid { background: var(--white); color: var(--black); border-color: var(--white); }
.btn.quiet { border-color: var(--dim); color: var(--grey); }
.btn.small { min-height: 38px; padding: 0 16px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn:active:not([disabled]) { transform: scale(.97); }
.link {
  font: 500 11px/1 var(--sans); font-stretch: 115%; letter-spacing: .24em; text-transform: uppercase;
  padding-bottom: 6px; border-bottom: 1px solid var(--dim); transition: border-color .3s, color .3s;
}
.link.danger { color: var(--grey); }

/* Bar */
.bar {
  position: sticky; top: 0; z-index: 40;
  padding-top: env(safe-area-inset-top, 0px);
  background: rgba(0, 0, 0, .86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; }
.mark { font: 500 12px/1 var(--sans); font-stretch: 125%; letter-spacing: .38em; white-space: nowrap; }
.mark small { color: var(--dim); letter-spacing: .24em; margin-left: 10px; font-size: 10px; }
.bar .right { display: flex; align-items: center; gap: 24px; }
.saved { color: var(--dim); transition: color .3s; }
.saved.on { color: var(--white); }

/* Fields */
.field { display: grid; gap: 8px; min-width: 0; }
.field > span { color: var(--grey); }
.field small { color: var(--dim); font-size: 13px; line-height: 1.5; }
.text {
  width: 100%; min-width: 0; background: transparent; color: var(--white);
  border: 0; border-bottom: 1px solid var(--dim); border-radius: 0;
  padding: 8px 0 10px; font: 300 18px/1.4 var(--sans);
  transition: border-color .25s;
}
.text::placeholder { color: var(--dim); }
.text:focus { outline: none; border-color: var(--white); }
textarea.text { resize: vertical; min-height: 72px; font-size: 16px; line-height: 1.6; }
input[type="date"].text { color-scheme: dark; }
.text.num { max-width: 140px; font: 400 28px/1.2 var(--display); }
.inline { display: flex; gap: 12px; align-items: end; }
.inline .text { flex: 1; }
.error { color: var(--white); font-size: 14px; min-height: 1.4em; margin: 0; }
.error:not(:empty)::before { content: "— "; color: var(--grey); }

/* Switch */
.switch { display: flex; align-items: center; justify-content: space-between; gap: 20px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch i {
  flex: none; position: relative; width: 48px; height: 26px; border: 1px solid var(--dim); transition: background .25s, border-color .25s;
}
.switch i::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: var(--grey);
  transition: transform .3s var(--ease), background .25s;
}
.switch input:checked + i { background: var(--white); border-color: var(--white); }
.switch input:checked + i::after { transform: translateX(22px); background: var(--black); }
.switch input:focus-visible + i { outline: 1px solid var(--white); outline-offset: 3px; }
.switch b { font-weight: 400; font-size: 17px; }
.switch small { display: block; color: var(--grey); font-size: 14px; }

/* Gate */
.gate { min-height: calc(100svh - 65px); display: grid; place-items: center; padding: 48px var(--gutter); }
.gate form { width: 100%; max-width: 420px; display: grid; gap: 30px; animation: rise .6s var(--ease); }
.gate h1 { font-size: clamp(40px, 6vw, 64px); line-height: 1; }
.gate p { margin: 0; color: var(--grey); }
@keyframes rise { from { transform: translateY(12px); opacity: .001; } to { transform: none; opacity: 1; } }
.shake { animation: shake .4s var(--ease); }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

/* Pages */
.page { padding-block: clamp(36px, 6vw, 72px) 120px; animation: rise .5s var(--ease); }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 20px 32px; flex-wrap: wrap; margin-bottom: 28px; }
.page-head h1 { font-size: clamp(40px, 5.6vw, 72px); line-height: 1; }
.page-head .actions { display: flex; gap: 12px; flex-wrap: wrap; }
.crumb { display: inline-block; margin-bottom: 18px; color: var(--grey); }
.tabs { display: flex; gap: clamp(18px, 3vw, 40px); border-bottom: 1px solid var(--line); margin-bottom: 32px; overflow-x: auto; scrollbar-width: none; }
.tab {
  position: relative; padding-bottom: 14px; color: var(--grey); flex: none;
  font: 500 11px/1 var(--sans); font-stretch: 115%; letter-spacing: .24em; text-transform: uppercase;
}
.tab sup { font-size: 9px; margin-left: 6px; color: var(--dim); vertical-align: top; }
.tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--white); transform: scaleX(0); transform-origin: left; transition: transform .4s var(--ease); }
.tab[aria-selected="true"] { color: var(--white); }
.tab[aria-selected="true"]::after { transform: scaleX(1); }

/* Folder list */
.newrow { display: flex; gap: 12px; align-items: end; border: 1px solid var(--line); background: var(--lift); padding: 20px 22px; margin-bottom: 24px; }
.newrow .text { flex: 1; }
.folders { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.folder {
  display: grid; grid-template-columns: 72px 1fr auto; gap: 20px; align-items: center;
  background: var(--black); padding: 16px 20px; text-align: left; width: 100%;
  transition: background .25s;
}
.folder .cover { width: 72px; height: 72px; background: var(--lift); overflow: hidden; }
.folder .cover canvas, .folder .cover img { width: 100%; height: 100%; object-fit: cover; }
.folder h3 { margin: 0 0 4px; font: 400 26px/1.1 var(--display); }
.folder .info { color: var(--grey); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
.folder .go { color: var(--dim); }
.tag { display: inline-block; border: 1px solid var(--dim); color: var(--ink); padding: 3px 8px; font-size: 10px; letter-spacing: .16em; }
.empty { color: var(--grey); padding: 28px 0; }

/* Folder editor */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { border: 1px solid var(--line); background: var(--lift); padding: 24px; display: grid; gap: 22px; align-content: start; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card h2 { font-size: 28px; line-height: 1.1; }
.card .sub { margin: -14px 0 0; color: var(--grey); font-size: 14px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 20px; }
.status { color: var(--grey); font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
.status b { color: var(--white); font-weight: 400; }
.sharebox { display: flex; gap: 10px; align-items: center; border: 1px solid var(--dim); padding: 6px 6px 6px 14px; }
.sharebox input { flex: 1; min-width: 0; background: none; border: 0; color: var(--white); font: 300 14px/1.4 var(--sans); }
.sharebox input:focus { outline: none; }

/* Photos */
.cams { display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 18px; }
.cams-head { display: flex; justify-content: space-between; align-items: center; gap: 10px 20px; flex-wrap: wrap; }
.cams-head .label { color: var(--grey); }
.cams-acts { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.fstrip { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fchip {
  display: inline-flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 14px; max-width: 100%;
  border: 1px solid var(--line); background: var(--black); color: var(--grey); font-size: 14px; white-space: nowrap;
  transition: border-color .2s, color .2s, background .2s;
}
.fchip span:not(.n) { overflow: hidden; text-overflow: ellipsis; }
.fchip svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.2; flex: none; }
.fchip .n { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.fchip[aria-pressed="true"] { border-color: var(--white); color: var(--white); }
.fchip[aria-pressed="true"] .n { color: var(--grey); }
.fchip.add { border-style: dashed; border-color: var(--dim); }
.fchip.catch { border-color: var(--white); background: var(--raise); color: var(--white); }
.fchip input { width: 15ch; min-width: 0; background: none; border: 0; border-bottom: 1px solid var(--white); color: var(--white); padding: 2px 0; font: 300 14px/1.4 var(--sans); }
.fchip input:focus { outline: none; }
.confirm { display: flex; justify-content: space-between; align-items: center; gap: 12px 20px; flex-wrap: wrap; border: 1px solid var(--dim); padding: 12px 14px; font-size: 14px; color: var(--grey); }
.confirm b { color: var(--white); font-weight: 400; }
.confirm .row { display: flex; gap: 10px; flex-wrap: wrap; }
.switches { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.switch.mini { justify-content: flex-start; gap: 12px; font-size: 14px; color: var(--grey); }
.switch.mini i { width: 40px; height: 22px; }
.switch.mini i::after { width: 14px; height: 14px; }
.switch.mini input:checked + i::after { transform: translateX(18px); }
.drop {
  position: relative; display: grid; justify-items: center; gap: 8px; text-align: center; padding: clamp(28px, 5vw, 44px) 20px;
  border: 1px dashed var(--dim); color: var(--grey); cursor: pointer; transition: border-color .25s, background .25s, color .25s;
}
.drop svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 1.1; margin-bottom: 6px; }
.drop b { font: 400 clamp(22px, 2.6vw, 28px)/1.2 var(--display); color: var(--ink); }
.drop .or { font-size: 14px; }
.drop .or u { color: var(--ink); text-underline-offset: 4px; text-decoration-color: var(--dim); }
.drop .to { margin-top: 6px; color: var(--grey); max-width: 100%; text-wrap: balance; }
.drop .to b { font: inherit; color: var(--white); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.drop:focus-within { border-color: var(--grey); }
.drop .phone { display: none; }
@media (hover: none) { .drop .desk { display: none; } .drop .phone { display: inline; } }
.queue { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.qrow { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; font-size: 14px; color: var(--grey); }
.qrow b { color: var(--white); font-weight: 400; }
.qrow .nums { font-variant-numeric: tabular-nums; }
.qbar { height: 2px; background: var(--line); }
.qbar i { display: block; height: 100%; width: 0; background: var(--white); transition: width .2s linear; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--dim); color: var(--grey); padding: 4px 10px; font-size: 12px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.thumbs .empty { grid-column: 1 / -1; margin: 0; padding: 4px 0; }
.thumb { position: relative; margin: 0; display: grid; gap: 4px; min-width: 0; }
.thumb[draggable="true"] { cursor: grab; }
.thumb.lift { opacity: .4; }
.thumb.failed { cursor: pointer; }
.thumb .ph { position: relative; aspect-ratio: 1; background: var(--black); overflow: hidden; }
.thumb .ph canvas, .thumb .ph img { width: 100%; height: 100%; object-fit: cover; transition: opacity .4s, filter .4s; pointer-events: none; }
.thumb figcaption { display: grid; min-width: 0; }
.thumb figcaption span { font-size: 12px; color: var(--grey); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb figcaption small { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb figcaption small:empty { display: none; }
.thumb .x {
  position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; display: grid; place-items: center;
  background: rgba(0, 0, 0, .7); border: 1px solid var(--dim); font-size: 16px; line-height: 1; color: var(--white);
}
.thumb.wait .x, .thumb.up .x { display: none; }
.thumb .up-state { position: absolute; inset: auto 0 0 0; padding: 0 8px 8px; display: grid; gap: 6px; color: var(--white); }
.thumb .up-state span { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }
.thumb .up-state i { display: block; height: 2px; background: rgba(255, 255, 255, .25); }
.thumb .up-state i b { display: block; height: 100%; width: 0; background: var(--white); }
.thumb.failed .up-state i { display: none; }
.thumb.wait .ph canvas, .thumb.failed .ph canvas { opacity: .35; filter: grayscale(1); }
.thumb.up .ph canvas { opacity: .6; }
.thumb.picked .ph { outline: 1px solid var(--white); outline-offset: -1px; }
.thumb .mark-on { position: absolute; top: 6px; left: 6px; background: var(--white); color: var(--black); padding: 3px 7px; font-size: 9px; letter-spacing: .16em; }
.thumb.fresh .ph { outline: 1px solid var(--white); outline-offset: -1px; }
.thumb.fresh .ph::after { content: "Added"; position: absolute; top: 6px; left: 6px; background: var(--white); color: var(--black); padding: 3px 7px; font: 500 9px/1.2 var(--sans); letter-spacing: .16em; text-transform: uppercase; }
.photohead { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
.photohead .tabs { margin: 0; border: 0; }

/* Full-window drop screen: aim at a section, then a folder */
.dropscreen {
  position: fixed; inset: 0; z-index: 80; background: rgba(0, 0, 0, .97); overflow-y: auto;
  display: grid; align-content: center; align-content: safe center; justify-items: center; gap: clamp(18px, 3vw, 28px);
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: fadein .2s var(--ease);
}
@keyframes fadein { from { opacity: 0; } }
.dropscreen .head { text-align: center; display: grid; gap: 10px; }
.dropscreen h2 { font-size: clamp(32px, 4.6vw, 60px); line-height: 1.05; }
.dropscreen .count { color: var(--grey); }
.dropscreen .ds-hint { color: var(--dim); text-align: center; }
.trow { width: min(100%, 980px); display: grid; gap: 10px; }
.trow > .label { color: var(--dim); }
.targets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ftargets { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
.target {
  display: grid; gap: 6px; align-content: center; justify-items: center; text-align: center; min-height: clamp(96px, 17vh, 170px); padding: 16px;
  border: 1px dashed var(--dim); background: var(--black); color: var(--grey); transition: border-color .2s, background .2s, color .2s, transform .25s var(--ease);
}
.target b { font: 400 clamp(24px, 2.8vw, 34px)/1.1 var(--display); color: var(--ink); overflow-wrap: anywhere; }
.target small { font-size: 13px; max-width: 28ch; }
.target.ft { min-height: 76px; }
.target.ft b { font-size: clamp(18px, 1.8vw, 22px); }
.target.on { border-style: solid; border-color: var(--white); background: var(--raise); color: var(--white); transform: scale(1.02); }
@media (max-width: 640px) { .targets { grid-template-columns: minmax(0, 1fr); } .target { min-height: 72px; } .target small { display: none; } }

.picklist { margin: 0; padding: 0; list-style: none; columns: 3 140px; column-gap: 20px; font-size: 14px; }
.picklist li { padding: 3px 0; border-bottom: 1px solid var(--line); break-inside: avoid; }

.hint { color: var(--dim); font-size: 13px; margin: -8px 0 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); z-index: 90;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--white); color: var(--black); padding: 14px 22px; width: max-content; max-width: calc(100% - 32px); text-align: center;
  transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Messages and contracts */
.chat { display: grid; gap: 12px; max-height: 460px; overflow-y: auto; padding: 4px 2px 8px; }
.msg { max-width: min(78%, 520px); padding: 12px 16px; border: 1px solid var(--line); background: var(--black); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
.msg.me { justify-self: end; background: var(--white); color: var(--black); border-color: var(--white); }
.msg small { display: block; margin-top: 6px; font-size: 11px; letter-spacing: .06em; color: var(--grey); }
.msg.me small { color: #555555; }
.composer { display: flex; gap: 12px; align-items: end; border-top: 1px solid var(--line); padding-top: 16px; }
.composer textarea { flex: 1; min-height: 48px; max-height: 200px; resize: none; }
.kdoc { border: 1px solid var(--line); background: var(--black); }
.kdoc-head { display: flex; justify-content: space-between; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: 16px 18px; }
.kdoc-head b { font: 400 22px/1.2 var(--display); }
.kdoc-head small { display: block; color: var(--grey); font-size: 13px; }
.kdoc details { border-top: 1px solid var(--line); }
.kdoc summary { cursor: pointer; padding: 12px 18px; color: var(--grey); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
.kdoc pre { margin: 0; padding: 0 18px 18px; white-space: pre-wrap; font: 300 14px/1.7 var(--sans); color: #cfcfcf; }
.kdoc .sig { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 0 18px 18px; color: var(--grey); font-size: 14px; }
.kdoc .sig img { height: 56px; width: auto; filter: invert(1); mix-blend-mode: screen; }
.state { padding: 4px 10px; border: 1px solid var(--dim); font-size: 10px; }
.state.done { background: var(--white); color: var(--black); border-color: var(--white); }
.inbox { display: inline-flex; align-items: center; gap: 8px; color: var(--white); }
.inbox::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--white); }
.tag.hot { background: var(--white); color: var(--black); border-color: var(--white); }

.preview-note { border: 1px solid var(--line); color: var(--grey); padding: 14px 18px; font-size: 14px; margin-bottom: 28px; }
.preview-note b { color: var(--ink); font-weight: 400; }

@media (hover: hover) {
  .btn:not([disabled]):hover { background: var(--white); color: var(--black); border-color: var(--white); }
  .btn.solid:not([disabled]):hover { background: transparent; color: var(--white); }
  .link:hover { border-color: var(--white); color: var(--white); }
  .folder:hover { background: #080808; }
  .folder:hover .go, .tab:hover, .crumb:hover { color: var(--white); }
  .drop:hover { border-color: var(--grey); }
  .fchip:hover { border-color: var(--dim); color: var(--white); }
  .thumb .x:hover { background: var(--white); color: var(--black); }
}
@media (max-width: 760px) {
  .bar .wrap { height: 56px; }
  .mark small { display: none; }
  .cards, .two { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 20px 18px; }
  .folder { grid-template-columns: 56px 1fr; gap: 14px; padding: 14px; }
  .folder .cover { width: 56px; height: 56px; }
  .folder .go { display: none; }
  .folder h3 { font-size: 22px; }
  .page-head .actions { width: 100%; }
  .page-head .actions .btn { flex: 1; }

  function tileFor(p) {

      ["pending", "state", "ctl", "file", "folder", "batch", "sent"].forEach(function (k) { delete p[k]; });
      Object.assign(p, r);
      if (folder && folderById(folder)) c.photoFolders[keyOf(p)] = folder;
      persist();
      if (ctl.stopped) { loadPhotos(); return; } /* it finished just as Stop was pressed, so it's in the gallery after all */
      b.done++; b.doneBytes += p.size;
      var ph = p.el.querySelector(".ph"), u = GS.photoUrl(p);
      if (u) { var im = new Image(); im.src = u; im.alt = p.name; ph.replaceChild(im, ph.firstChild); }
      p.el.querySelector("figcaption span").textContent = p.name;
      p.el.classList.add("fresh");
      setTimeout(function () { if (p.el) p.el.classList.remove("fresh"); }, 2400);
    }).catch(function () {
      if (ctl.stopped) return;
      p.state = "failed"; p.sent = 0; delete p.ctl;
      b.failed++; b.bytes -= p.size;
    }).then(function () {
      active--;
      if (b === batch) { paintTile(p); paintPhotoTabs(); paintQueue(); }
      if (batch && !queue.length && !active) wrapUp(false); else pump();
    });
  }
  /* b.made holds folder ids; names are looked up when shown, so a rename mid-upload reads right. */
  function madeNames(b) { return b.made.map(folderById).filter(Boolean).map(function (f) { return f.name; }); }
  function wrapUp(stopped) {
    var b = batch; batch = null;
    $("up-queue").hidden = true;
    var t = (stopped ? "Stopped. " : "") + plural(b.done, "photo") + " added" + (b.section ? " to " + titleOf(b.section) : "");
    var made = madeNames(b);
    if (made.length) t += " · new folder" + (made.length > 1 ? "s " : " ") + made.join(", ");
    if (b.failed > 0) t += " · " + b.failed + " didn't upload, tap to retry";
    var skip = [];
    if (b.dup) skip.push(b.dup + " already there");
    if (b.other) skip.push(plural(b.other, "file") + " not a photo");
    if (skip.length) t += " · skipped " + skip.join(", ");
    toast(t, 5000);
    paintPhotoTabs();
    if (stopped) loadPhotos();
  }
  function paintQueue() {
    var b = batch;
    if (!b) return;
    $("up-queue").hidden = false;
    var flying = photos.reduce(function (s, p) { return s + (p.batch === b && p.state === "up" ? (p.sent || 0) * p.size : 0); }, 0);
    var into = b.folder === "auto" ? ", sorting by camera" : folderById(b.folder) ? " › " + esc(folderById(b.folder).name) : "";
    $("q-text").innerHTML = "Uploading" + (b.section ? " to " + titleOf(b.section) : "") + into + " · <b>" + b.done + " of " + b.total + "</b> done";
    var sent = Math.min(b.bytes, flying + b.doneBytes);
    $("q-size").textContent = mb(sent) + " of " + mb(b.bytes);
    $("q-bar").style.width = (b.bytes ? sent / b.bytes * 100 : 0) + "%";
    var chips = madeNames(b).map(function (n) { return '<span class="chip">New folder: ' + esc(n) + "</span>"; });
    if (b.dup) chips.push('<span class="chip">' + plural(b.dup, "photo") + " already here, skipped</span>");
    if (b.other) chips.push('<span class="chip">' + plural(b.other, "file") + " not a photo, skipped</span>");
    if (b.failed > 0) chips.push('<span class="chip">' + b.failed + " didn't upload</span>");
    $("q-chips").innerHTML = chips.join("");
  }
  function mb(n) { return n >= 1e9 ? (n / 1e9).toFixed(1) + " GB" : n >= 1e6 ? Math.round(n / 1e6) + " MB" : Math.ceil(n / 1e3) + " KB"; }
  function stopAll() {
    if (!batch) return;
    queue = [];
    photos = photos.filter(function (p) {
      if (!p.pending || p.batch !== batch) return true;
      if (p.ctl) { p.ctl.stopped = true; if (p.ctl.abort) p.ctl.abort(); }
      if (p.el) p.el.remove();
      return false;
    });
    wrapUp(true);
  }
  $("q-stop").onclick = stopAll;
  uploads = { busy: function () { return !!batch; }, stop: stopAll };

  /* The full-window drop screen: aim at a section, then a folder. */
  var aimSec = folderTab, aimFold = null;
  function aim() {
    $("dropscreen").querySelectorAll("[data-k]").forEach(function (t) { t.classList.toggle("on", t.dataset.k === aimSec); });
    $("dropscreen").querySelectorAll("[data-f]").forEach(function (t) { t.classList.toggle("on", t.dataset.f === (aimFold || "none")); });
  }
  var self = dropTarget = {
    alive: function () { return !!$("cam-strip"); },
    open: function (n) {
      $("ds-count").textContent = n ? plural(n, "item") : "Photos";
      $("ds-name").textContent = c.name || "this client";
      $("ds-sections").innerHTML = PT.map(function (t) {
        return '<div class="target" data-k="' + t.key + '"><b>' + t.title + "</b><small>" + t.drop + "</small></div>";
      }).join("");
      var ft = ['<div class="target ft" data-f="auto"><b>Sort by camera</b><small>Each photo goes to its camera\'s folder</small></div>'];
      c.folders.forEach(function (f) { ft.push('<div class="target ft" data-f="' + esc(f.id) + '"><b>' + esc(f.name) + "</b></div>"); });
      ft.push('<div class="target ft" data-f="none"><b>No folder</b></div>');
      ft.push('<div class="target ft" data-f="new"><b>+ New folder</b><small>Named after the folder you drop</small></div>');
      $("ds-folders").innerHTML = ft.join("");
      aimSec = folderTab; aimFold = dropFolder(); aim();
    },
    over: function (t) {
      if (t && t.dataset.k) aimSec = t.dataset.k;
      if (t && t.dataset.f) aimFold = t.dataset.f === "none" ? null : t.dataset.f;
      aim();
    },
    drop: function (dt) {
      var s = aimSec, f = aimFold;
      collectDrop(dt).then(function (files) { if (dropTarget === self) addFiles(files, s, f); });
    }
  };
  $("files").addEventListener("change", function () {
    addFiles(Array.from(this.files).map(function (f) { return { file: f, dir: "" }; }), folderTab, dropFolder());
    this.value = "";
  });
  loadPhotos();

  /* Selection */
  var sel = $("sel");
  if (c.selection) {
    var s = c.selection;
    sel.innerHTML = '<div class="status" style="border:0;padding:0"><span>Sent ' + fmtDate(s.sentAt) + ' · <b>' + plural(s.frames.length, "frame") + "</b></span>" +
      '<button class="btn small" type="button" id="copy-sel">Copy file names</button></div>' +
      (s.note ? '<p style="margin:16px 0;color:var(--grey)">Notes: <span style="color:var(--ink)">' + esc(s.note) + "</span></p>" : "") +
      '<ul class="picklist" style="margin-top:16px">' + s.frames.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul>";
    $("copy-sel").onclick = function () { copy(s.frames.join("\n")); };
  } else {
    var n = (c.picks || []).length;
    sel.innerHTML = '<p class="muted" style="margin:0">' + (n ? "Your client has picked " + plural(n, "frame") + " so far but hasn't sent the selection yet." : "Nothing sent yet. When your client sends their picks, the list shows up here.") + "</p>";
  }

  /* Messages */
  var shown = 0;
  function loadChat() {
    return GS.listMessages(c.id).then(function (l) {
      if (l.length === shown && shown) return;
      shown = l.length;
      var box = $("chat");
      if (!box) return;
      box.replaceChildren();
      if (!l.length) box.innerHTML = '<p class="muted" style="margin:0">No messages yet. Say hello, or wait for their first question.</p>';
      l.forEach(function (m) {
        var b = document.createElement("div");
        b.className = "msg " + (m.from === "admin" ? "me" : "them");
        b.textContent = m.text;
        var t = document.createElement("small");
        t.textContent = (m.from === "admin" ? "You" : c.name) + " · " + timeLabel(m.at) + (m.from === "admin" ? (m.read ? " · Seen" : "") : "");
        b.appendChild(t); box.appendChild(b);
      });
      box.scrollTop = box.scrollHeight;
      return GS.markRead(c.id, "admin").then(checkActivity);
    });
  }
  openFolder = { id: c.id, refresh: function () { shown = -1; loadChat(); loadContracts(); } };
  $("composer").addEventListener("submit", function (e) {
    e.preventDefault();
    var ta = $("msg"), text = ta.value.trim();
    if (!text) return;
    ta.value = ""; ta.style.height = "auto";
    GS.addMessage(c.id, "admin", text).then(function () { shown = -1; loadChat(); });
  });
  $("msg").addEventListener("input", function () { this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 200) + "px"; });
  $("msg").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && matchMedia("(hover: hover)").matches) { e.preventDefault(); $("composer").requestSubmit(); }
  });
  loadChat();

  /* Contracts */
  function loadContracts() {
    GS.listContracts(c.id).then(function (ks) {
      var box = $("klist");
      if (!box) return;
      box.replaceChildren();
      ks.forEach(function (k) {
        var done = k.status === "signed";
        var d = document.createElement("div"); d.className = "kdoc";
        d.innerHTML = '<div class="kdoc-head"><div><b></b><small>Sent ' + fmtDate(k.sentAt) + (done ? " · Signed " + fmtDate(k.signedAt) : "") + '</small></div>' +
          '<div style="display:flex;gap:16px;align-items:center"><span class="label state' + (done ? " done" : "") + '">' + (done ? "Signed" : "Awaiting signature") + '</span>' +
          (done ? "" : '<button class="link danger" type="button" data-withdraw>Withdraw</button>') + '</div></div>' +
          (done ? '<div class="sig"><img alt="Signature"><span></span></div>' : "") +
          '<details><summary>Read agreement</summary><pre></pre></details>';
        d.querySelector("b").textContent = k.title;
        d.querySelector("pre").textContent = k.body;
        if (done) {
          if (k.signature.image) d.querySelector(".sig img").src = k.signature.image; else d.querySelector(".sig img").remove();
          d.querySelector(".sig span").textContent = "Signed by " + k.signature.name + " on " + new Date(k.signedAt).toLocaleString();
        } else d.querySelector("[data-withdraw]").onclick = function () {
          if (!confirm("Withdraw this contract? Your client won't see it any more.")) return;
          GS.deleteContract(k.id).then(function () { toast("Contract withdrawn"); loadContracts(); checkActivity(); });
        };
        box.appendChild(d);
      });
    });
  }
  $("k-new").onclick = function () {
    $("k-body").value = GS.fillTemplate(S.contractTemplate || "", c);
    $("k-form").hidden = false; this.hidden = true; $("k-title").focus();
  };
  $("k-cancel").onclick = function () { $("k-form").hidden = true; $("k-new").hidden = false; };
  $("k-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = $("k-title").value.trim(), body = $("k-body").value.trim();
    if (!title || !body) { $("k-err").textContent = "Add a title and the agreement text."; return; }
    if (/\[[^\]]+\]/.test(body) && !confirm("The agreement still has [bracketed] blanks. Send anyway?")) return;
    $("k-err").textContent = "";
    GS.saveContract({ id: GS.uid(), clientId: c.id, title: title, body: body, status: "sent", sentAt: Date.now(), signedAt: null, signature: null })
      .then(function () {
        $("k-form").hidden = true; $("k-new").hidden = false;
        toast("Sent. It's waiting in their gallery."); loadContracts(); checkActivity();
      });
  });
  loadContracts();

  $("del").addEventListener("click", function () {
    if (!confirm("Delete the folder for " + c.name + " and all its photos? This can't be undone.")) return;
    GS.deleteClient(c.id).then(function () { toast("Folder deleted"); location.hash = ""; });
  });
}

/* ---------- Site text & settings ---------- */
function renderSettings() {
  var app = $("app"), saveT;
  function persist() { clearTimeout(saveT); saveT = setTimeout(function () { GS.saveSettings(S).then(flashSaved); }, 350); }
  app.innerHTML = '<div class="wrap page">' +
    '<div class="page-head"><h1>Site <em>text</em></h1></div>' + pageTabs("settings") +
    '<div class="cards">' +
    '<section class="card wide"><h2>Default <em>wording</em></h2>' +
      '<p class="sub">What every client sees unless you change it in their folder. Wrap a word in *asterisks* for italics; {name} inserts the client\'s name.</p>' +
      '<div class="two" id="words"></div></section>' +
    '<section class="card"><h2>Settings</h2>' +
      '<label class="field"><span class="label">Default days to download</span><input class="text num" id="s-days" inputmode="numeric" value="' + S.downloadDays + '"></label>' +
      '<label class="field"><span class="label">Your email</span><input class="text" id="s-email" type="email" value="' + esc(S.contactEmail) + '"><small>Where selections go when no form endpoint is set.</small></label>' +
      '<label class="field"><span class="label">Email notifications (Formspree endpoint)</span><input class="text" id="s-end" value="' + esc(S.selectionEndpoint) + '" placeholder="https://formspree.io/f/..."><small>Paste a Formspree endpoint and you\'ll get an email whenever a client messages you, signs a contract or sends a selection.</small></label>' +
      '<div class="field"><span class="label">Desktop alerts</span><small>Pop-up alerts on this computer for new messages and signatures while the admin portal is open.</small>' +
        '<button class="btn small" type="button" id="s-alerts" style="justify-self:start"></button></div>' +
    '</section>' +
    '<section class="card wide"><h2>Contract <em>template</em></h2>' +
      '<p class="sub">The starting point for every new contract. {name}, {shoot}, {date} and {location} fill in from the client\'s folder. This is a sample only, so have a lawyer review your terms.</p>' +
      '<textarea class="text" id="s-tpl" style="min-height:360px"></textarea>' +
    '</section>' +
    (GS.mode === "remote"
      ? '<section class="card"><h2>Storage &amp; <em>sign-in</em></h2>' +
          '<div class="status" style="border:0;padding:0"><span>Backblaze</span><b>Connected</b></div>' +
          '<div class="status"><span>Google sign-in for clients</span><b>' + (S.googleClientId ? "On" : "Off: add GOOGLE_CLIENT_ID in Vercel") + '</b></div>' +
          '<div class="field" style="border-top:1px solid var(--line);padding-top:16px"><span class="label">Finish storage setup</span>' +
            '<small>Run this once so uploads and "Download all" can reach your portal bucket. Run it again if you add another web address.</small>' +
            '<button class="btn small" type="button" id="st-run" style="justify-self:start">Finish setup</button></div>' +
          '<div id="st-master" hidden style="display:grid;gap:14px">' +
            '<small class="muted">Backblaze only lets the master key change this setting. Paste it once below. It\'s used for this one change and never saved. Find it under Application Keys, then Master Application Key (generating a new one is fine).</small>' +
            '<label class="field"><span class="label">Master keyID</span><input class="text" id="st-id" autocomplete="off" spellcheck="false"></label>' +
            '<label class="field"><span class="label">Master applicationKey</span><input class="text" id="st-key" type="password" autocomplete="off"></label>' +
            '<button class="btn small solid" type="button" id="st-go" style="justify-self:start">Finish with master key</button></div>' +
          '<p class="error" id="st-err"></p>' +
          '<small class="muted">Your admin password is set in Vercel (ADMIN_PASSWORD). Change it there, then redeploy.</small>' +
        '</section>'
      : '<section class="card"><h2>Admin <em>password</em></h2>' +
      '<label class="field"><span class="label">New password</span><input class="text" id="np1" type="password" autocomplete="new-password"></label>' +
      '<label class="field"><span class="label">Type it again</span><input class="text" id="np2" type="password" autocomplete="new-password"></label>' +
      '<p class="error" id="np-err"></p>' +
      '<button class="btn" type="button" id="np-save" style="justify-self:start">Change password</button>' +
    '</section>') + '</div></div>';

  var words = $("words");
  GS.TEXT_FIELDS.forEach(function (f) {
    var l = document.createElement("label"); l.className = "field";
    var input = f.long ? document.createElement("textarea") : document.createElement("input");
    input.className = "text"; input.value = S.text[f.key]; input.placeholder = GS.DEFAULT_TEXT[f.key];
    input.addEventListener("input", function () { S.text[f.key] = input.value.trim() || GS.DEFAULT_TEXT[f.key]; persist(); });
    l.innerHTML = '<span class="label">' + f.label + '</span>';
    l.appendChild(input);
    words.appendChild(l);
  });
  $("s-days").addEventListener("input", function () {
    this.value = this.value.replace(/[^0-9]/g, "");
    S.downloadDays = toInt(this.value) || 14; persist();
  });
  $("s-email").addEventListener("input", function () { S.contactEmail = this.value.trim(); persist(); });
  $("s-end").addEventListener("input", function () { S.selectionEndpoint = this.value.trim(); persist(); });
  $("s-tpl").value = S.contractTemplate || "";
  $("s-tpl").addEventListener("input", function () { S.contractTemplate = this.value; persist(); });
  function paintAlerts() {
    var b = $("s-alerts");
    if (!("Notification" in window)) { b.textContent = "Not supported in this browser"; b.disabled = true; return; }
    var p = Notification.permission;
    b.textContent = p === "granted" ? "Alerts are on" : p === "denied" ? "Blocked in browser settings" : "Turn on alerts";
    b.disabled = p !== "default";
  }
  $("s-alerts").onclick = function () { Notification.requestPermission().then(paintAlerts); };
  paintAlerts();
  if (GS.mode === "remote") {
    var stDone = function (r) { $("st-err").textContent = ""; $("st-master").hidden = true; toast("Storage setup finished"); };
    var stFail = function (e) {
      if (/needs-master-key/.test(e.message)) { $("st-master").hidden = false; $("st-err").textContent = ""; }
      else $("st-err").textContent = e.message;
    };
    $("st-run").onclick = function () { GS.setupStorage().then(stDone, stFail); };
    $("st-go").onclick = function () {
      GS.setupStorage($("st-id").value.trim(), $("st-key").value.trim()).then(function (r) {
        $("st-id").value = $("st-key").value = ""; stDone(r);
      }, stFail);
    };
    return;
  }
  $("np-save").addEventListener("click", function () {
    var a = $("np1").value, b = $("np2").value, err = $("np-err");
    if (a.length < 8) { err.textContent = "Use at least 8 characters."; return; }
    if (a !== b) { err.textContent = "The two passwords don't match."; return; }
    err.textContent = "";
    GS.hash(a).then(function (h) { S.adminHash = h; return GS.saveSettings(S); }).then(function () {
      $("np1").value = $("np2").value = ""; toast("Password changed");
    });
  });
}

/* ---------- Activity: unread messages and signatures, checked every few seconds ---------- */
var activity = { unread: {}, contracts: {}, seen: null };
var openFolder = null;
function timeLabel(t) {
  var d = new Date(t), today = new Date().toDateString() === d.toDateString();
  return (today ? "" : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", ") +
    d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}
function alertMe(title, body) {
  toast(title);
  try { if ("Notification" in window && Notification.permission === "granted") new Notification(title, { body: body }); } catch (e) {}
}
function checkActivity() {
  return Promise.all([GS.allMessages(), GS.allContracts(), GS.listClients()]).then(function (r) {
    var msgs = r[0], ks = r[1], names = {};
    r[2].forEach(function (c) { names[c.id] = c.name; });
    var unread = {}, contracts = {}, total = 0, first = null;
    msgs.forEach(function (m) {
      if (m.from === "client" && !m.read) { unread[m.clientId] = (unread[m.clientId] || 0) + 1; total++; first = first || m.clientId; }
    });
    ks.forEach(function (k) {
      var x = contracts[k.clientId] = contracts[k.clientId] || { total: 0, signed: 0 };
      x.total++; if (k.status === "signed") x.signed++;
    });
    /* Alert on anything new since the last check (not on first load). */
    var seen = { msgs: {}, signed: {} };
    msgs.forEach(function (m) { if (m.from === "client") seen.msgs[m.id] = 1; });
    ks.forEach(function (k) { if (k.status === "signed") seen.signed[k.id] = 1; });
    if (activity.seen) {
      var changed = false;
      msgs.forEach(function (m) {
        if (m.from === "client" && !activity.seen.msgs[m.id]) { changed = true; alertMe("New message from " + (names[m.clientId] || "a client"), m.text); }
      });
      ks.forEach(function (k) {
        if (k.status === "signed" && !activity.seen.signed[k.id]) { changed = true; alertMe((names[k.clientId] || "A client") + " signed " + (k.title || "their contract"), ""); }
      });
      if (changed && openFolder) openFolder.refresh();
    }
    activity = { unread: unread, contracts: contracts, seen: seen };
    var ib = $("inbox");
    ib.hidden = !total || !ss("gsp-admin");
    ib.textContent = plural(total, "new message");
    ib.href = first ? "#" + encodeURIComponent(first) : "#";
  });
}
var lastCheck = 0;
setInterval(function () {
  if (!ss("gsp-admin") || Date.now() - lastCheck < Math.max(6000, GS.pollMs)) return;
  lastCheck = Date.now(); checkActivity().catch(function () {});
}, 1000);

/* ---------- Start ---------- */
GS.useRole("admin");
GS.getSettings().then(function (s) {
  S = s;
  var signedIn = ss("gsp-admin") && (GS.mode === "remote" ? GS.hasSession() : S.adminHash);
  if (signedIn) enter(); else showGate();
});
</script>
</body>
